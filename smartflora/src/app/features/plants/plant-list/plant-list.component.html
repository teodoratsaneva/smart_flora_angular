<app-header />

<div class="plants-page">
  <header class="plants-header">
    <h1>My Plants</h1>
    @if (user()?.email) {
      <p class="user-email">{{ user()?.email }}</p>
    }
  </header>

  @if (plants().length === 0) {
    <div class="empty-state">
      <p>You haven't added any plants yet.</p>
    </div>
  } @else {
    <div class="plant-grid">
      @for (plant of plants(); track plant.id) {
        <article class="plant-card">
          @if (plant.imgUrl) {
            <img [src]="plant.imgUrl" [alt]="plant.name" class="plant-photo" />
          } @else {
            <div class="plant-photo placeholder">🌱</div>
          }
          <h2>{{ plant.name }}</h2>
          <p class="variety">{{ plant.variety }}</p>
          <div class="card-actions">
            <a [routerLink]="['/plants', plant.id]" class="secondary">Details</a>
            <button
              type="button"
              class="secondary"
              [disabled]="isDataEnteredToday(plant)"
              (click)="openAddData(plant)"
              matTooltip="{{ tooltipMessage(plant) }}"
            >Add Data</button>
          </div>
        </article>
      }
    </div>
  }
  <a routerLink="/plants/add" class="add-plant-fab" aria-label="Add Plant">+ Add Plant</a>
</div>

<app-add-data-plant [plant]="activePlant()" [user]="user()" (closed)="closeAddData()" />
